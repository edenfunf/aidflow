services:
  db:
    image: postgres:16
    container_name: aidflow-db
    environment:
      POSTGRES_USER: resqlink
      # Set in .env (see .env.example); compose refuses to start without it so
      # no credential ever lives in this file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: resqlink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resqlink -d resqlink"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    container_name: aidflow-api
    environment:
      DATABASE_URL: postgresql+psycopg://resqlink:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}@db:5432/resqlink
      APP_NAME: AidFlow API
      APP_VERSION: 1.0.0
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      AUTH_SECRET: ${AUTH_SECRET:-}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      # only true behind a reverse proxy that sets X-Forwarded-For itself
      TRUST_FORWARDED_FOR: ${TRUST_FORWARDED_FOR:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DEMO_MODE: ${DEMO_MODE:-false}
      WEB_PUBLIC_BASE_URL: ${WEB_PUBLIC_BASE_URL:-http://localhost:3000}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-http://localhost:8000}
      REPORTER_HASH_SALT: ${REPORTER_HASH_SALT:-}
      CLUSTER_REQUIRED_UNIQUE_REPORTERS: ${CLUSTER_REQUIRED_UNIQUE_REPORTERS:-2}
      CLUSTER_RADIUS_METERS: ${CLUSTER_RADIUS_METERS:-100}
      CLUSTER_TIME_WINDOW_MINUTES: ${CLUSTER_TIME_WINDOW_MINUTES:-60}
      MEDIA_ROOT: /app/media
      CWA_API_KEY: ${CWA_API_KEY:-}
      NCDR_CAP_FEED_URL: ${NCDR_CAP_FEED_URL:-}
      OFFICIAL_DATA_CACHE_SECONDS: ${OFFICIAL_DATA_CACHE_SECONDS:-300}
      OFFICIAL_DATA_TIMEOUT_SECONDS: ${OFFICIAL_DATA_TIMEOUT_SECONDS:-12}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-AidFlow <no-reply@localhost>}
      EMIC_SUBMIT_URL: ${EMIC_SUBMIT_URL:-}
      EMIC_API_TOKEN: ${EMIC_API_TOKEN:-}
      TDX_CLIENT_ID: ${TDX_CLIENT_ID:-}
      TDX_CLIENT_SECRET: ${TDX_CLIENT_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      # citizen / agency photos (metadata lives in Postgres, bytes here)
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        # NEXT_PUBLIC_* must be inlined at build time for the client bundle.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        EMBED_ALLOWED_ORIGINS: ${EMBED_ALLOWED_ORIGINS:-}
    container_name: aidflow-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  media_data:
