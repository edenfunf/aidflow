# Render Blueprint — backend API + free Postgres.
# Dashboard → New + → Blueprint → pick this repo; Render reads this file.
services:
  - type: web
    name: aidflow-api
    runtime: docker
    plan: free
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aidflow-db
          property: connectionString
      - key: DEMO_MODE
        value: "false"
      # demo: allow the Cloudflare frontend (and anything else) to call the API
      - key: CORS_ORIGINS
        value: "*"
      # set to the Cloudflare Workers URL after the frontend is deployed
      - key: WEB_PUBLIC_BASE_URL
        sync: false
      # staff login: set a long random secret and the first administrator's password
      - key: AUTH_REQUIRED
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      # encrypts reporters' contact details at rest — never rotate without re-encrypting
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: API_PUBLIC_BASE_URL
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false

databases:
  - name: aidflow-db
    plan: free
    databaseName: resqlink
    user: resqlink
